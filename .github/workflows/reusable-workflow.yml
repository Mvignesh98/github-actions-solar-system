name: Testing - Reusable Workflow
on:
    workflow_call:
        inputs:
            ingress-url:
                description: "Provide the Ingress URL"
                required: true
                type: string
        outputs:
            APP_INGRESS_URL:
                description: "The Ingress URL of the deployed application"
                value: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}

jobs:
    integration-test:
        runs-on: ubuntu-latest
        steps:
            - env:
                  URL: "${{ inputs.ingress-url }}"
              run: |
                  curl https://$URL/live -s -k | jq -r .status | grep -i live
        outputs:
            APP_INGRESS_URL: ${{ inputs.ingress-url }}
